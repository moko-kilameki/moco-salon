<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ぬいぐるみ心整所 モコ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=Zen+Maru+Gothic:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Zen Maru Gothic', 'Noto Serif JP', serif;
      background: #FFFFFF;
      color: #555555;
      line-height: 2;
      font-weight: 300;
      min-height: 100vh;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 100px 40px;
    }

    .hidden {
      display: none !important;
    }

    /* ========================================
       トップページ
    ======================================== */
    .welcome {
      text-align: center;
      padding-top: 120px;
    }

    .welcome-title {
      font-size: 2.4rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      margin-bottom: 100px;
      color: #444444;
    }

    .welcome-title::before {
      content: '';
      display: block;
      width: 1px;
      height: 80px;
      background: linear-gradient(to bottom, transparent, rgba(100, 100, 100, 0.3), transparent);
      margin: 0 auto 80px;
    }

    .kirameki-visual {
      width: 360px;
      height: 360px;
      margin: 0 auto 60px;
    }

    .kirameki-visual img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.05));
    }

    .welcome-catchphrase {
      font-size: 1.6rem;
      line-height: 2.5;
      margin-bottom: 40px;
      color: #555555;
      font-weight: 300;
    }

    .welcome-note {
      font-size: 0.95rem;
      color: #777777;
      margin-bottom: 100px;
      letter-spacing: 0.1em;
    }

    .welcome-description {
      margin: 80px auto 100px;
      max-width: 500px;
      padding: 50px 40px;
      border: 1px solid rgba(100, 100, 100, 0.15);
      background: rgba(255, 255, 255, 0.5);
    }

    .welcome-description-text {
      font-size: 1.3rem;
      line-height: 2.2;
      color: #555555;
      text-align: center;
    }

    .kirameki-intro {
      margin: 100px auto;
      max-width: 400px;
      text-align: center;
    }

    .kirameki-intro-text {
      font-size: 1.2rem;
      line-height: 2.2;
      color: #666666;
    }

    /* ボタン */
    .button {
      background: transparent;
      border: 1px solid rgba(100, 100, 100, 0.3);
      padding: 22px 60px;
      font-size: 1.1rem;
      font-family: 'Zen Maru Gothic', serif;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: all 0.4s ease;
      font-weight: 300;
      color: #555555;
      display: inline-block;
      text-decoration: none;
    }

    .button:hover {
      background: rgba(100, 100, 100, 0.03);
      border-color: rgba(100, 100, 100, 0.4);
    }

    .button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .button-primary {
      border-color: rgba(100, 100, 100, 0.4);
    }

    .button-small {
      padding: 12px 30px;
      font-size: 0.9rem;
    }

    .button-secondary {
      border-color: rgba(100, 100, 100, 0.2);
      color: #666666;
      font-size: 0.95rem;
    }

    .nav-buttons {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      margin-top: 80px;
    }

    /* ========================================
       問診フォーム
    ======================================== */
    .title {
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      margin-bottom: 20px;
      text-align: center;
      color: #555555;
    }

    .text {
      font-size: 0.9rem;
      color: #666666;
    }

    .text-center {
      text-align: center;
    }

    .form-group {
      margin-bottom: 50px;
    }

    .label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 12px;
      color: #555555;
      letter-spacing: 0.1em;
    }

    .input, .textarea {
      width: 100%;
      padding: 16px 20px;
      font-size: 0.9rem;
      font-family: 'Zen Maru Gothic', serif;
      border: 1px solid rgba(100, 100, 100, 0.2);
      background: #FFFFFF;
      color: #555555;
      transition: all 0.3s ease;
      font-weight: 300;
    }

    .input:focus, .textarea:focus {
      outline: none;
      border-color: rgba(100, 100, 100, 0.4);
    }

    .textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.8;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      color: #555555;
      transition: color 0.3s ease;
    }

    .checkbox-label:hover {
      color: #444444;
    }

    .checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .terms-agreement {
      margin-top: 60px;
      padding: 30px;
      border: 1px solid rgba(100, 100, 100, 0.15);
      background: rgba(255, 255, 255, 0.5);
      border-radius: 2px;
    }

    .terms-agreement label {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
    }

    .terms-link {
      background: none;
      border: none;
      text-decoration: underline;
      color: #555555;
      cursor: pointer;
      font-size: inherit;
      font-family: inherit;
      padding: 0;
      transition: color 0.3s ease;
    }

    .terms-link:hover {
      color: #333333;
    }

    .action-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 80px;
      flex-wrap: wrap;
    }

    /* ========================================
       カルテ表示
    ======================================== */
    .carte-header {
      text-align: center;
      margin-bottom: 80px;
      padding-bottom: 40px;
      border-bottom: 1px solid rgba(100, 100, 100, 0.1);
    }

    .carte-nui-name {
      font-size: 1.3rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      margin-bottom: 20px;
      color: #555555;
    }

    .carte-moco {
      font-size: 0.75rem;
      color: #777777;
      letter-spacing: 0.15em;
    }

    .carte-body {
      font-size: 1rem;
      line-height: 2.5;
      color: #555555;
      white-space: pre-line;
      margin-bottom: 60px;
      text-align: center;
    }

    .carte-note {
      font-size: 0.7rem;
      line-height: 2;
      color: #777777;
      font-style: italic;
      text-align: center;
      margin: 60px auto;
    }

    .carte-divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(100, 100, 100, 0.15), transparent);
      margin: 80px 0;
    }

    .carte-transition {
      text-align: center;
      margin: 80px auto;
    }

    .carte-transition-text {
      font-size: 0.95rem;
      line-height: 2.2;
      color: #555555;
      margin-bottom: 50px;
    }

    .yorisoi-section {
      margin: 80px auto;
      max-width: 600px;
    }

    .yorisoi-card {
      padding: 40px;
      border: 1px solid rgba(100, 100, 100, 0.2);
      margin-bottom: 30px;
      text-align: center;
    }

    .yorisoi-name {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .yorisoi-ear {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-block;
    }

    .yorisoi-phrase {
      font-size: 1.1rem;
      line-height: 2.2;
      color: #555555;
      margin-bottom: 20px;
    }

    .yorisoi-description {
      font-size: 0.8rem;
      line-height: 1.8;
      color: #666666;
    }

    .prescription-card {
      margin: 60px auto;
      max-width: 350px;
      aspect-ratio: 1.6;
      border: 1px solid rgba(100, 100, 100, 0.2);
      background: #FFFFFF;
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .prescription-card-phrase {
      font-size: 0.95rem;
      line-height: 2.2;
      color: #555555;
    }

    /* ========================================
       サロン案内ページ
    ======================================== */
    .salon-info-title {
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      margin-bottom: 30px;
      text-align: center;
      color: #555555;
    }

    .salon-info-description {
      font-size: 0.95rem;
      line-height: 2.5;
      color: #666666;
      text-align: center;
      margin-bottom: 80px;
    }

    .salon-box {
      padding: 60px 40px;
      border: 1px solid rgba(100, 100, 100, 0.15);
      margin-bottom: 60px;
      background: rgba(255, 255, 255, 0.5);
    }

    .salon-box-title {
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      margin-bottom: 30px;
      color: #555555;
      text-align: center;
    }

    .salon-items {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
    }

    .salon-item {
      padding: 20px;
      border-left: 2px solid rgba(100, 100, 100, 0.2);
      background: rgba(255, 255, 255, 0.3);
      font-size: 0.85rem;
      color: #555555;
    }

    .salon-price {
      text-align: center;
      margin-bottom: 40px;
    }

    .salon-price-amount {
      font-size: 1.3rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      margin-bottom: 15px;
      color: #444444;
    }

    .salon-price-note {
      font-size: 0.75rem;
      color: #777777;
    }

    .salon-note {
      font-size: 0.75rem;
      line-height: 2;
      color: #777777;
      text-align: center;
      margin-bottom: 40px;
    }

    .yorisoi-option-section {
      margin: 100px auto 60px;
      max-width: 600px;
    }

    .yorisoi-option-title {
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      margin-bottom: 30px;
      color: #555555;
      text-align: center;
    }

    .yorisoi-option-description {
      font-size: 0.85rem;
      line-height: 2.2;
      color: #666666;
      text-align: center;
      margin-bottom: 40px;
    }

    .yorisoi-option-box {
      padding: 40px;
      border: 1px solid rgba(100, 100, 100, 0.15);
      margin-bottom: 30px;
    }

    .yorisoi-options-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .yorisoi-option-item {
      padding: 20px;
      border: 1px solid rgba(100, 100, 100, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFFFFF;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .yorisoi-option-item:hover {
      border-color: rgba(100, 100, 100, 0.3);
      background: rgba(255, 255, 255, 0.8);
    }

    .yorisoi-option-name {
      font-size: 0.85rem;
      color: #555555;
    }

    .yorisoi-option-price {
      font-size: 0.9rem;
      color: #444444;
    }

    /* ========================================
       決済ページ
    ======================================== */
    .payment-summary {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(100, 100, 100, 0.15);
      padding: 40px;
      margin-bottom: 60px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .payment-summary-row {
      display: flex;
      justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px solid rgba(100, 100, 100, 0.1);
      font-size: 0.9rem;
      color: #555555;
    }

    .payment-summary-row:last-child {
      border-bottom: none;
      font-size: 1.1rem;
      padding-top: 25px;
      margin-top: 15px;
      border-top: 1px solid rgba(100, 100, 100, 0.2);
      color: #444444;
    }

    .payment-info-box {
      padding: 30px;
      border: 1px solid rgba(100, 100, 100, 0.1);
      background: rgba(255, 255, 255, 0.3);
      margin-bottom: 30px;
      text-align: center;
    }

    .payment-info-text {
      font-size: 0.85rem;
      line-height: 2;
      color: #555555;
      margin-bottom: 30px;
    }

    .payment-features {
      text-align: center;
      margin-bottom: 30px;
    }

    .payment-features-text {
      font-size: 0.7rem;
      line-height: 2;
      color: #777777;
    }

    /* ========================================
       法的ページ
    ======================================== */
    .legal-section {
      margin-bottom: 60px;
      padding-bottom: 40px;
      border-bottom: 1px solid rgba(100, 100, 100, 0.08);
    }

    .legal-section:last-of-type {
      border-bottom: none;
    }

    .legal-label {
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      margin-bottom: 20px;
      color: #444444;
    }

    .legal-content {
      font-size: 0.8rem;
      line-height: 2.2;
      color: #555555;
    }

    .legal-content strong {
      font-weight: 400;
      color: #444444;
    }

    /* ========================================
       実績・お客様の声（準備中）
    ======================================== */
    @media (min-width: 600px) {
      .results-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
    }

    /* ========================================
       アニメーション
    ======================================== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeIn 1s ease-out;
    }

    /* ========================================
       フッターリンク
    ======================================== */
    .footer-links {
      text-align: center;
      margin-top: 100px;
      padding-top: 50px;
      border-top: 1px solid rgba(100, 100, 100, 0.08);
    }

    .footer-links-container {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ========================================
       管理画面
    ======================================== */
    .admin-login {
      max-width: 400px;
      margin: 0 auto;
      text-align: center;
    }

    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 40px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 60px;
      padding-bottom: 30px;
      border-bottom: 1px solid rgba(100, 100, 100, 0.1);
    }

    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 60px;
    }

    .stat-card {
      padding: 30px;
      border: 1px solid rgba(100, 100, 100, 0.15);
      background: rgba(255, 255, 255, 0.5);
      text-align: center;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 400;
      color: #444444;
      margin-bottom: 10px;
    }

    .stat-label {
      font-size: 0.8rem;
      color: #666666;
      letter-spacing: 0.1em;
    }

    .carte-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .carte-list-item {
      padding: 25px;
      border: 1px solid rgba(100, 100, 100, 0.15);
      background: #FFFFFF;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .carte-list-item:hover {
      border-color: rgba(100, 100, 100, 0.3);
      background: rgba(255, 255, 255, 0.8);
    }

    .carte-info { flex: 1; }

    .carte-name {
      font-size: 1rem;
      color: #444444;
      margin-bottom: 8px;
    }

    .carte-date {
      font-size: 0.75rem;
      color: #777777;
    }

    .carte-actions {
      display: flex;
      gap: 10px;
    }

    .carte-detail {
      padding: 40px;
      border: 1px solid rgba(100, 100, 100, 0.15);
      background: rgba(255, 255, 255, 0.5);
      margin-bottom: 30px;
    }

    .carte-detail-section {
      margin-bottom: 30px;
      padding-bottom: 30px;
      border-bottom: 1px solid rgba(100, 100, 100, 0.08);
    }

    .carte-detail-section:last-child { border-bottom: none; }

    .carte-detail-label {
      font-size: 0.8rem;
      color: #666666;
      margin-bottom: 10px;
      letter-spacing: 0.1em;
    }

    .carte-detail-content {
      font-size: 0.9rem;
      color: #444444;
      line-height: 2;
    }

    .admin-tabs {
      display: flex;
      gap: 20px;
      margin-bottom: 40px;
      border-bottom: 1px solid rgba(100, 100, 100, 0.1);
    }

    .admin-tab {
      padding: 15px 30px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      font-size: 0.85rem;
      color: #666666;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Zen Maru Gothic', serif;
    }

    .admin-tab.active {
      color: #444444;
      border-bottom-color: #666666;
    }

    .admin-tab:hover { color: #555555; }

    .settings-section {
      margin-bottom: 60px;
      padding: 40px;
      border: 1px solid rgba(100, 100, 100, 0.15);
      background: rgba(255, 255, 255, 0.5);
    }

    .settings-title {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      margin-bottom: 30px;
      color: #444444;
      text-align: center;
    }

    .settings-item {
      display: flex;
      gap: 20px;
      align-items: center;
      padding: 20px;
      border: 1px solid rgba(100, 100, 100, 0.1);
      margin-bottom: 15px;
      background: #FFFFFF;
    }

    .settings-item-label {
      flex: 1;
      font-size: 0.85rem;
      color: #555555;
    }

    .settings-item-input {
      width: 200px;
      padding: 12px 16px;
      font-size: 0.85rem;
      font-family: 'Zen Maru Gothic', serif;
      border: 1px solid rgba(100, 100, 100, 0.2);
      background: #FFFFFF;
      color: #555555;
    }

    .settings-item-input:focus {
      outline: none;
      border-color: rgba(100, 100, 100, 0.4);
    }

    .settings-item-textarea {
      flex: 1;
      padding: 12px 16px;
      font-size: 0.85rem;
      font-family: 'Zen Maru Gothic', serif;
      border: 1px solid rgba(100, 100, 100, 0.2);
      background: #FFFFFF;
      color: #555555;
      min-height: 60px;
      resize: vertical;
    }

    .settings-item-textarea:focus {
      outline: none;
      border-color: rgba(100, 100, 100, 0.4);
    }

    /* ========================================
       レスポンシブ
    ======================================== */
    @media (max-width: 768px) {
      .container { padding: 60px 20px; }
      .welcome { padding-top: 80px; }
      .welcome-title { font-size: 2rem; }
      .kirameki-visual { width: 280px; height: 280px; }
      .welcome-catchphrase { font-size: 1.3rem; }
      .welcome-description-text { font-size: 1.1rem; }
      .kirameki-intro-text { font-size: 1rem; }
      .button { padding: 18px 40px; font-size: 1rem; }
      .action-buttons { flex-direction: column; }
      .admin-container { padding: 40px 20px; }
      .admin-stats { grid-template-columns: 1fr; }
      .carte-list-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
      .carte-actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    // ========================================
    // データ定義
    // ========================================
    const YORISOI_MOCO_TYPES = {
      SUKIMA: {
        id: 'sukima', name: 'すきまモコ', earColor: '#C8E6C9',
        phrase: '静かに。', description: '考えすぎて休まらない時に',
        keywords: ['考え', '思考', '頭', '休まらない', 'ぐるぐる']
      },
      HOKORORBI: {
        id: 'hokororbi', name: 'ほころびモコ', earColor: '#F5F5DC',
        phrase: '少し、ゆるんでもいいだね〜', description: '緊張や感情疲労がある時に',
        keywords: ['緊張', '張', '硬', 'ゆるめ', '力', '気遣']
      },
      OWARI: {
        id: 'owari', name: 'おわりモコ', earColor: '#E0E0E0',
        phrase: 'ここまででいいのだモコ', description: '区切りがつかない時に',
        keywords: ['終わ', '区切', '続け', '背負', 'やめられない']
      },
      DAIJOUBU: {
        id: 'daijoubu', name: 'だいじょうぶモコ', earColor: '#B3E5FC',
        phrase: 'いまのままでも、ちゃんと大丈夫', description: '不安や心配がある時に',
        keywords: ['不安', '心配', '壊れ', '確かめ', '弱']
      },
      SOBA: {

    function selectYorisoiMoco(questionnaire) {
      const allText = `${questionnaire.recentCondition} ${questionnaire.concerns} ${questionnaire.fatigueType.join(' ')}`.toLowerCase();
      const scores = Object.values(YORISOI_MOCO_TYPES).map(moco => {
        let score = 0;
        moco.keywords.forEach(keyword => { if (allText.includes(keyword)) score += 1; });
        return { moco, score };
      });
      scores.sort((a, b) => b.score - a.score);
      return scores[0].score > 0 ? scores[0].moco : YORISOI_MOCO_TYPES.SUKIMA;
    }

    function selectHitoyasumiItems(questionnaire) {
      const allText = `${questionnaire.recentCondition} ${questionnaire.concerns} ${questionnaire.fatigueType.join(' ')} ${questionnaire.personality}`.toLowerCase();
      const itemScores = state.settings.hitoyasumiItems.map(item => {
        let score = 0;
        const keywords = {
          'pound_cake': ['疲れ', '身体', '重', '眠', '休息'],
          'madeleine': ['緊張', '硬', '力', '張'],
          'kohaku': ['考え', '頭', 'ぐるぐる', '思考'],
          'dry_tea': ['間', '余白', '時間', 'ゆっくり'],
          'dry_soup': ['温', '冷', '安心', '落ち着']
        };
        if (keywords[item.id]) {
          keywords[item.id].forEach(keyword => { if (allText.includes(keyword)) score += 1; });
        }
        return { item, score };
      });
      itemScores.sort((a, b) => b.score - a.score);
      const selectedCount = Math.max(1, Math.min(3, itemScores.filter(i => i.score > 0).length));
      return itemScores.slice(0, selectedCount).map(s => s.item);
    }

        localStorage.setItem(`${STORAGE_PREFIX}carte_${id}`, JSON.stringify(dataToSave));

            <button class="button button-small" onclick="app.showAdmin()">← 管理画面へ戻る</button>
          </div>
          <h2 class="salon-info-title">カルテ編集</h2>
          <div style="max-width: 700px; margin: 0 auto;">
            <div class="form-group">
              <label class="label">名前</label>
              <input id="edit-name" class="input" value="${carte.questionnaire.name || ''}"/>
            </div>
            <div class="form-group">
              <label class="label">年齢</label>
              <input id="edit-age" class="input" value="${carte.questionnaire.age || ''}"/>
            </div>
            <div class="form-group">
              <label class="label">性格</label>
              <textarea id="edit-personality" class="textarea">${carte.questionnaire.personality || ''}</textarea>
            </div>
            <div class="form-group">
              <label class="label">最近の様子</label>
              <textarea id="edit-recentCondition" class="textarea">${carte.questionnaire.recentCondition || ''}</textarea>
            </div>
            <div class="form-group">
              <label class="label">気になる変化</label>
              <textarea id="edit-concerns" class="textarea">${carte.questionnaire.concerns || ''}</textarea>
            </div>
            <div class="form-group">
              <label class="label">役割</label>
              <textarea id="edit-role" class="textarea">${carte.questionnaire.role || ''}</textarea>
            </div>
            <div class="action-buttons">
              <button class="button" onclick="app.showAdmin()">キャンセル</button>
              <button class="button button-primary" onclick="app.saveEditedCarte()">保存</button>
            </div>
          </div>
        </div>
      `;
    }

    function calculateStats(cartes) {
      const now = new Date();
      const paidCartes = cartes.filter(c => c.isPaid || c.paymentStatus === 'paid' || c.paymentStatus === 'completed');
      const thisMonth = cartes.filter(c => {
        const d = new Date(c.createdAt);
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      }).length;
      const mocoCount = {};
      cartes.forEach(c => {
        const name = c.selectedYorisoiMoco?.name || '未選定';
        mocoCount[name] = (mocoCount[name] || 0) + 1;
      });
      const mostCommonMoco = Object.entries(mocoCount).sort((a, b) => b[1] - a[1])[0]?.[0] || '-';
      return {
        totalCartes: cartes.length,
        freeOnly: cartes.filter(c => !c.isPaid || c.paymentStatus === 'free').length,
        paid: paidCartes.length,
        conversionRate: cartes.length > 0 ? Math.round((paidCartes.length / cartes.length) * 100) : 0,
        thisMonth,
        mostCommonMoco
      };
    }

    async function getAllCartes() {
      try {
        const keys = Object.keys(localStorage).filter(k => k.startsWith(STORAGE_PREFIX + 'carte_'));
        const cartes = keys.map(key => {
          try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
        }).filter(c => c !== null);
        return cartes.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      } catch (error) { return []; }
    }

    async function getCarte(carteId) {
      try {
        const data = localStorage.getItem(`${STORAGE_PREFIX}carte_${carteId}`);
        return data ? JSON.parse(data) : null;
      } catch (error) { return null; }
    }

    async function deleteCarteById(carteId) {
      try {
        localStorage.removeItem(`${STORAGE_PREFIX}carte_${carteId}`);
        return { success: true };
      } catch (error) { return { success: false }; }
    }

    // ========================================
    // アプリケーションロジック
    // ========================================
    const app = {
      showWelcome() { state.view = 'welcome'; render(); },
      showQuestionnaireStart() { state.view = 'questionnaireStart'; render(); },
      showQuestionnaire() { state.view = 'questionnaire'; render(); this.attachQuestionnaireListeners(); },

      attachQuestionnaireListeners() {
        document.getElementById('input-name').addEventListener('input', (e) => { state.questionnaire.name = e.target.value; this.updateSubmitButton(); });
        document.getElementById('input-age').addEventListener('input', (e) => { state.questionnaire.age = e.target.value; });
        document.getElementById('input-personality').addEventListener('input', (e) => { state.questionnaire.personality = e.target.value; });
        document.getElementById('input-recent').addEventListener('input', (e) => { state.questionnaire.recentCondition = e.target.value; });
        document.getElementById('input-concerns').addEventListener('input', (e) => { state.questionnaire.concerns = e.target.value; });
        document.getElementById('input-role').addEventListener('input', (e) => { state.questionnaire.role = e.target.value; });
        document.querySelectorAll('[data-fatigue-type]').forEach(checkbox => {
          checkbox.addEventListener('change', (e) => {
            const type = e.target.dataset.fatigueType;
            if (e.target.checked) { if (!state.questionnaire.fatigueType.includes(type)) state.questionnaire.fatigueType.push(type); }
            else { state.questionnaire.fatigueType = state.questionnaire.fatigueType.filter(t => t !== type); }
          });
        });
        const termsCheckbox = document.getElementById('terms-checkbox');
        if (termsCheckbox) {
          termsCheckbox.addEventListener('change', (e) => { state.agreedToTerms = e.target.checked; this.updateSubmitButton(); });
        }
      },

      updateSubmitButton() {
        const btn = document.querySelector('.button.button-primary[onclick="app.submitQuestionnaire()"]');
        if (btn) btn.disabled = !(state.questionnaire.name && state.agreedToTerms);
      },

      async submitQuestionnaire() {
        if (!state.agreedToTerms) { alert('利用規約とプライバシーポリシーに同意してください。'); return; }
        try {
          const yorisoiMoco = selectYorisoiMoco(state.questionnaire);
          const hitoyasumiItems = selectHitoyasumiItems(state.questionnaire);
          state.selectedYorisoiMoco = yorisoiMoco;
          state.carteText = generateCarteText(state.questionnaire);
          const carteData = {
            questionnaire: state.questionnaire, selectedYorisoiMoco: yorisoiMoco,
            hitoyasumiItems, carteText: state.carteText,
            createdAt: new Date().toISOString(), isPaid: false, paymentStatus: 'free'
          };
          const result = await saveCarte(carteData);
          if (result.success) {
            state.currentCarteId = result.id;
            await sendEmailNotification(carteData, result.id);
          } else { alert('カルテの保存に失敗しました。'); return; }
          state.view = 'carteIntro'; render();
        } catch (error) { alert('エラーが発生しました: ' + error.message); }
      },

      showSalonInfo() { state.view = 'salonInfo'; render(); },
      backToCarte() { state.view = 'carteIntro'; render(); },
      showHitoyasumi() { state.view = 'hitoyasumi'; render(); },
      showYorisoiOptions() { state.view = 'fullCarte'; render(); },
      showPayment() { state.view = 'payment'; render(); },

      selectYorisoiOption(period, price, label) {
        state.selectedYorisoiOption = { period, price, label };
        state.view = 'payment'; render();
      },

      proceedToSquareCheckout() {
        const PAYMENT_LINKS = {
          base: 'https://square.link/u/4qdjvN3G',
          with7day: 'https://square.link/u/yr1Bj3LF',
          with1month: 'https://square.link/u/sCjRdBZX',
          withForever: 'https://square.link/u/24Dzk7Fh'
        };
        let checkoutUrl = PAYMENT_LINKS.base;
        if (state.selectedYorisoiOption) {
          const map = { '7day': PAYMENT_LINKS.with7day, '1month': PAYMENT_LINKS.with1month, 'forever': PAYMENT_LINKS.withForever };
          checkoutUrl = map[state.selectedYorisoiOption.period] || PAYMENT_LINKS.base;
        }
        if (state.currentCarteId) {
          sessionStorage.setItem('pending_carte_id', state.currentCarteId);
          sessionStorage.setItem('payment_initiated', 'true');
        }
        window.location.href = checkoutUrl;
      },

      async checkPaymentSuccess() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('payment') === 'success' && sessionStorage.getItem('payment_initiated')) {
          sessionStorage.removeItem('payment_initiated');
          const carteId = sessionStorage.getItem('pending_carte_id');
          if (carteId) {
            state.currentCarteId = carteId;
            sessionStorage.removeItem('pending_carte_id');
          }
          state.view = 'customerInfo'; render();
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      },

      showCustomerInfo() { state.view = 'customerInfo'; render(); this.attachCustomerInfoListeners(); },

      attachCustomerInfoListeners() {
        ['name','email','phone','postalCode','address','notes'].forEach(field => {
          const el = document.getElementById(`customer-${field === 'postalCode' ? 'postal' : field}`);
          if (el) el.addEventListener('input', (e) => { state.customerInfo[field] = e.target.value; });
        });
      },

      async submitCustomerInfo() {
        if (!state.customerInfo.name) { alert('お名前を入力してください'); return; }
        if (!state.customerInfo.email) { alert('メールアドレスを入力してください'); return; }
        if (!state.customerInfo.phone) { alert('電話番号を入力してください'); return; }
        if (!state.customerInfo.postalCode) { alert('郵便番号を入力してください'); return; }
        if (!state.customerInfo.address) { alert('ご住所を入力してください'); return; }
        try {
          if (state.currentCarteId) {
            const carte = await getCarte(state.currentCarteId);
            if (carte) {
              carte.customerInfo = state.customerInfo;
              carte.paymentStatus = 'completed';
              await saveCarte(carte);
            }
          }
          state.view = 'fullCarte'; render();
        } catch (error) { alert('情報の保存に失敗しました。'); }
      },

      showTerms() { state.view = 'terms'; render(); },
      showLegal() { state.view = 'legal'; render(); },
      showPrivacy() { state.view = 'privacy'; render(); },
      showAdminLogin() { state.view = 'adminLogin'; render(); },

      async attemptAdminLogin() {
        const password = document.getElementById('admin-password').value;
        if (password === 'moco2026') {
          state.isAdminAuthenticated = true;
          await this.showAdmin();
        } else { alert('パスワードが正しくありません'); }
      },

      async showAdmin() {
        if (!state.isAdminAuthenticated) { this.showAdminLogin(); return; }
        state.view = 'admin';
        state.carteList = await getAllCartes();
        render();
      },

      async viewCarteDetail(carteId) {
        const carte = await getCarte(carteId);
        if (carte) { state.selectedCarteForView = carte; state.view = 'adminCarteDetail'; render(); }
      },

      async showEditCarte(carteId) {
        const carte = await getCarte(carteId);
        if (carte) { state.selectedCarteForEdit = carte; state.view = 'adminEditCarte'; render(); this.attachEditCarteListeners(); }
      },

      attachEditCarteListeners() {
        ['name','age','personality','recentCondition','concerns','role'].forEach(field => {
          const el = document.getElementById(`edit-${field}`);
          if (el) el.addEventListener('input', (e) => { state.selectedCarteForEdit.questionnaire[field] = e.target.value; });
        });
      },

      async saveEditedCarte() {
        if (!state.selectedCarteForEdit) return;
        const result = await saveCarte(state.selectedCarteForEdit);
        if (result.success) { alert('カルテを更新しました'); this.showAdmin(); }
        else { alert('更新に失敗しました'); }
      },

      async deleteCarte(carteId) {
        if (!confirm('このカルテを削除してもよろしいですか？')) return;
        const result = await deleteCarteById(carteId);
        if (result.success) { alert('カルテを削除しました'); this.showAdmin(); }
        else { alert('削除に失敗しました'); }
      },

      logoutAdmin() { state.isAdminAuthenticated = false; state.view = 'welcome'; render(); },
      switchAdminTab(tab) { state.adminCurrentTab = tab; render(); },
      updateYorisoiOptionPrice(index, price) { state.settings.yorisoiOptions[index].price = parseInt(price) || 0; },
      updateHitoyasumiItemName(index, name) { state.settings.hitoyasumiItems[index].name = name; },
      updateHitoyasumiItemDescription(index, description) { state.settings.hitoyasumiItems[index].description = description; },

      async saveSettings() {
        try {
          sessionStorage.setItem(STORAGE_PREFIX + 'settings', JSON.stringify(state.settings));
          alert('設定を保存しました');
        } catch (error) { alert('設定の保存に失敗しました'); }
      },

      async loadSettings() {
        try {
          const data = sessionStorage.getItem(STORAGE_PREFIX + 'settings');
          if (data) state.settings = JSON.parse(data);
        } catch (error) { console.log('設定読み込みをスキップ'); }
      }
    };

    // ========================================
    // レンダリング
    // ========================================
    function render() {
      const views = {
        welcome: renderWelcome,
        questionnaireStart: renderQuestionnaireStart,
        questionnaire: renderQuestionnaire,
        carteIntro: renderCarteIntro,
        salonInfo: renderSalonInfo,
        hitoyasumi: renderHitoyasumi,
        yorisoiOptions: renderYorisoiOptions,
        payment: renderPayment,
        customerInfo: renderCustomerInfo,
        fullCarte: renderFullCarte,
        terms: renderTerms,
        legal: renderLegal,
        privacy: renderPrivacy,
        adminLogin: renderAdminLogin,
        admin: renderAdmin,
        adminCarteDetail: renderAdminCarteDetail,
        adminEditCarte: renderAdminEditCarte
      };
      document.getElementById('app').innerHTML = views[state.view]();
      window.scrollTo(0, 0);
      if (state.view === 'customerInfo') app.attachCustomerInfoListeners();
    }

    window.app = app;

    (async function init() {
      await app.loadSettings();
      app.checkPaymentSuccess();
      if (state.view === 'welcome') render();
    })();
  </script>
</body>
